services:
  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      - redis

  app-production:
    profiles:
      - production
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      - redis

volumes:
  redis-data:
  app-node-modules:
